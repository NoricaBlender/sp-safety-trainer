<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Assessment Results</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="results">
  <div id="endOverlay">
    <div class="panel">
      <div id="endTitle" class="title">Assessment complete</div>
      <div id="endStats" class="stats"></div>
      <button id="tryAgainBtn" class="btn">Try assessment again</button>
    </div>
  </div>

  <script>
    (function(){
      const el = document.getElementById('endStats');
      let data = null;
      try { data = JSON.parse(sessionStorage.getItem('assessmentResults') || 'null'); } catch(e) {}
      if (!data || !Array.isArray(data.lines)) {
        el.textContent = "No results found.\n(Go back and finish the assessment.)";
      } else {
        el.textContent = data.lines.join("\n");
      }

      document.getElementById('tryAgainBtn').addEventListener('click', () => {
        // Hard reset back to the 3D page so HUD (crosshair etc.) is fresh.
        location.href = 'index.html?restart=' + Date.now();
      });
    })();
  </script>
</body>
</html>
